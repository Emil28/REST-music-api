name: Test and deploy REST API

on:
  push:
    branches:
      - Database
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore REST-music-api.slnx

      - name: Test
        run: dotnet test REST-music-api.slnx --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish REST-music-api/REST-music-api.csproj --configuration Release --no-restore --output ./publish

      - name: Check Azure deployment settings
        id: deployment-settings
        shell: bash
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [[ -z "$AZURE_WEBAPP_NAME" || -z "$AZURE_WEBAPP_PUBLISH_PROFILE" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Azure deployment skipped; configure AZURE_WEBAPP_NAME and AZURE_WEBAPP_PUBLISH_PROFILE."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure App Service
        if: steps.deployment-settings.outputs.ready == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
